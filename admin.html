<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard | Hillcreek Properties</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/logo-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { background: var(--linen); }
    .adm-nav { background: var(--navy); color: #fff; }
    .adm-nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 72px; }
    .adm-nav .brand img { height: 54px; background: #fff; padding: 4px 8px; border-radius: 8px; }
    .adm-nav .brand .wordmark { color: #fff; }
    .adm-nav .right { display: flex; align-items: center; gap: 18px; font-size: .84rem; color: rgba(255,255,255,.75); }
    .adm-nav a.lnk { color: #fff; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
    .adm-nav button { background: transparent; border: 1px solid rgba(255,255,255,.4); color: #fff; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-family: var(--sans); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; }
    .demo-bar { background: #fff3cd; color: #6b4e00; font-size: .88rem; padding: 10px 24px; text-align: center; border-bottom: 1px solid #f1e2a6; }
    .demo-bar a { color: #6b4e00; text-decoration: underline; }
    .login { max-width: 420px; margin: 80px auto; }
    .tabs { display: flex; gap: 8px; margin: 36px 0 24px; border-bottom: 1px solid var(--sand); }
    .tab { background: none; border: 0; padding: 12px 18px; font-family: var(--sans); font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab.active { color: var(--navy); border-bottom-color: var(--navy); }
    .tab .n { background: var(--sage-soft); color: var(--navy); border-radius: 999px; padding: 1px 8px; font-size: .72rem; margin-left: 6px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .toolbar h2 { margin: 0; font-size: 1.9rem; }
    .toolbar .summary { color: var(--muted); font-size: .9rem; }
    .plist { display: grid; gap: 12px; }
    .prow { background: #fff; border-radius: 14px; padding: 14px 18px; display: grid; grid-template-columns: 72px 1fr auto auto; gap: 18px; align-items: center; box-shadow: var(--shadow); }
    .prow .thumb { width: 72px; height: 54px; border-radius: 8px; object-fit: cover; background: var(--sand); }
    .prow .nm { font-family: var(--serif); font-size: 1.25rem; color: var(--navy); font-weight: 600; line-height: 1.1; }
    .prow .ad { color: var(--muted); font-size: .86rem; }
    .prow .meta { font-size: .78rem; color: var(--muted); margin-top: 3px; letter-spacing: .02em; }
    .prow .status { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 500; text-align: right; min-width: 120px; }
    .prow .status.on { color: var(--green); } .prow .status.off { color: var(--muted); }
    .prow .actions { display: flex; align-items: center; gap: 14px; }
    @media (max-width: 700px) { .prow { grid-template-columns: 56px 1fr; } .prow .status { text-align: left; } .prow .actions { grid-column: 1 / -1; justify-content: space-between; } }
    /* toggle switch */
    .switch { position: relative; width: 58px; height: 32px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .sl { position: absolute; inset: 0; background: #d5d0c7; border-radius: 999px; cursor: pointer; transition: .25s; }
    .switch .sl::before { content: ""; position: absolute; width: 26px; height: 26px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .25s; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    .switch input:checked + .sl { background: var(--green); }
    .switch input:checked + .sl::before { transform: translateX(26px); }
    .switch input:disabled + .sl { opacity: .5; cursor: wait; }
    .icon-btn { background: #fff; border: 1px solid var(--sand); border-radius: 999px; padding: 8px 16px; font-family: var(--sans); font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; color: var(--navy); }
    .icon-btn:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
    .icon-btn.danger:hover { background: #a33a2a; border-color: #a33a2a; }
    /* editor drawer */
    .drawer-bg { position: fixed; inset: 0; background: rgba(17,29,53,.5); z-index: 90; display: none; }
    .drawer-bg.open { display: block; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); background: var(--cream); z-index: 95; transform: translateX(100%); transition: transform .3s ease; overflow: auto; box-shadow: var(--shadow-lg); }
    .drawer.open { transform: none; }
    .drawer .inner { padding: 32px 36px 60px; }
    .drawer h2 { font-size: 1.9rem; margin-bottom: 4px; }
    .drawer .x { position: absolute; top: 18px; right: 22px; background: none; border: 0; font-size: 1.8rem; cursor: pointer; color: var(--muted); }
    .drawer .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .photos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 8px; }
    .photos .ph { position: relative; aspect-ratio: 4/3; border-radius: 10px; overflow: hidden; background: var(--sand); }
    .photos .ph img { width: 100%; height: 100%; object-fit: cover; }
    .photos .ph button { position: absolute; top: 6px; right: 6px; background: rgba(27,42,71,.85); color: #fff; border: 0; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 1rem; line-height: 1; }
    .cover-prev { width: 100%; aspect-ratio: 16/8; object-fit: cover; border-radius: 12px; background: var(--sand); margin-bottom: 10px; }
    .upload { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .upload input[type=file] { width: auto; padding: 8px; font-size: .85rem; }
    .field-hint { font-size: .78rem; color: var(--muted); margin-top: 4px; }
    fieldset { border: 1px solid var(--sand); border-radius: 14px; padding: 18px 20px 22px; margin: 0 0 20px; background: #fff; }
    legend { font-family: var(--sans); font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--taupe); padding: 0 8px; }
    .save-bar { position: sticky; bottom: 0; background: var(--cream); padding: 16px 0 0; display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--sand); margin-top: 10px; }
    /* inquiries */
    .inq { background: #fff; border-radius: 14px; padding: 18px 22px; box-shadow: var(--shadow); margin-bottom: 12px; display: grid; grid-template-columns: 1fr auto; gap: 12px; }
    .inq .k { display: inline-block; font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--sage-soft); color: var(--navy); margin-right: 8px; font-weight: 500; }
    .inq .k.apply { background: #e2ebf7; } .inq .k.tour { background: #fbeedc; } .inq .k.contact { background: #ece6f5; }
    .inq .who { font-weight: 500; font-size: 1.05rem; color: var(--navy); }
    .inq .ct { font-size: .9rem; color: var(--muted); margin: 4px 0; }
    .inq .ct a { color: var(--navy); }
    .inq .msg { font-size: .94rem; margin-top: 8px; white-space: pre-wrap; }
    .inq .dt { font-size: .76rem; color: var(--muted); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; padding: 12px 22px; border-radius: 999px; font-size: .9rem; opacity: 0; transition: .3s; z-index: 300; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%); }
  </style>
</head>
<body>
  <div id="demo-bar"></div>
  <header class="adm-nav"><div class="wrap">
    <span id="adm-brand"></span>
    <div class="right">
      <a class="lnk" href="index.html" target="_blank">View site &nearr;</a>
      <span id="who"></span>
      <button id="signout" style="display:none">Sign out</button>
    </div>
  </div></header>

  <main class="wrap" id="app"></main>

  <div class="drawer-bg" id="drawer-bg"></div>
  <div class="drawer" id="drawer"><div class="inner" id="drawer-inner"></div></div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
